[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="data/*.json,assets/crossing/manifest.json"
exclude_filter="tests/*,AGENTS.md,NATIVE-API.md,PORT-STATUS.md,*.md"
export_path="../dist/godot/windows/ArrowSpaceShift.exe"

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
application/modify_resources=false
application/product_name="Arrow Space Shift"
application/file_description="Arrow Space Shift"
codesign/enable=false

[preset.1]
name="Web"
platform="Web"
runnable=false
export_filter="all_resources"
include_filter="data/*.json,assets/crossing/manifest.json"
exclude_filter="tests/*,AGENTS.md,NATIVE-API.md,PORT-STATUS.md,*.md"
export_path="../dist/godot/web/index.html"

[preset.1.options]
custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=false
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/shell.html"
html/export_icon=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=false
progressive_web_app/enabled=false
